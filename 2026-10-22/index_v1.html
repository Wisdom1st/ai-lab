<div class="wrap">
<header>
  <h1>印章会唱歌</h1>
  <div class="sub">把朱砂印变成五声琴音，从一台手机“唱”到另一台</div>

  <button class="tab on" id="tSend">🎵 我来唱</button>

  <div class="grid" id="grid"></div>
  <button class="big" id="sing">♪ 唱出去</button>
  <button class="small" id="self">只有一台手机？自己唱给自己听</button>
</section>

  <button class="big ink" id="listen">👂 开始听</button>
  <div class="status" style="font-size:16px">请说，仆人敬听！（撒母耳记上 3:10）</div>
</section>

<section class="album">
  <h2>我的印谱</h2>
  <div class="slots" id="slots"></div>
</section>

<footer>
<b>怎么玩：</b>两台手机靠近（一臂远），一台点「我来听」→「开始听」，另一台选一枚印点「唱出去」。听的手机会把琴声变回印章，盖在纸上！<br>
<b>原理：</b>每枚印都被编成几个五声音阶（宫商角徵羽）的音，用喇叭“唱”出来，另一台用麦克风听出是哪几个音，再变回印章——不用网络、不用服务器。<br>
篆字：霞鹜篆书（LXGW Seal，SIL OFL 1.1）；楷字：霞鹜文楷（OFL 1.1）。经文：和合本。
</footer>

<script>

   一帧 = [铃1, 铃2, 数据d, 校验c]，c=(7d+3)%16，永远 ≠ d，所以相邻符号必不同。 */
var Modem = (function(){
  var NAMES = ['宫','商','角','徵','羽'];
  var FREQS = [];
  var base = [523.25,587.33,659.26,783.99,880.00]; // C5 D5 E5 G5 A5
  for (var o=0;o<4;o++) for (var k=0;k<5;k++) FREQS.push(base[k]*Math.pow(2,o));
  FREQS = FREQS.slice(0,18); // C5..E8
  var M1=16, M2=17;
  var SYM=0.16, GAP=0.045, REP=3, PAUSE=0.22;
  function check(d){ return (d*7+3)%16; }
  function frame(d){ return [M1,M2,d,check(d)]; }
  function schedule(d){ // -> [{idx,t,dur}]
    var out=[], t=0;
    for (var r=0;r<REP;r++){
      frame(d).forEach(function(s){ out.push({idx:s,t:t,dur:SYM}); t+=SYM+GAP; });
      t+=PAUSE;
    }
    return {notes:out,total:t};
  }
  // Goertzel 功率（加汉宁窗）
  var winCache={};
  function hann(n){ if(winCache[n]) return winCache[n]; var w=new Float32Array(n); for(var i=0;i<n;i++) w[i]=0.5-0.5*Math.cos(2*Math.PI*i/(n-1)); return winCache[n]=w; }
  function powers(buf, sr){
    var n=buf.length, w=hann(n), out=new Float32Array(FREQS.length);
    for (var f=0;f<FREQS.length;f++){
      var c=2*Math.cos(2*Math.PI*FREQS[f]/sr), s1=0,s2=0;
      for (var i=0;i<n;i++){ var s0=buf[i]*w[i]+c*s1-s2; s2=s1; s1=s0; }
      var p=s1*s1+s2*s2-c*s1*s2;
      out[f]=10*Math.log10(p/(n*n)+1e-14);
    }
    return out;
  }
  function Decoder(onMsg){
    this.onMsg=onMsg; this.cand=-1; this.run=0; this.last=-1; this.seq=[]; this.silent=0; this.lastLevels=null; this.lastHit=-1;
  }
  Decoder.prototype.feed=function(buf, sr){
    var p=powers(buf,sr); this.lastLevels=p;
    var sorted=Array.prototype.slice.call(p).sort(function(a,b){return a-b;});
    var med=sorted[Math.floor(sorted.length/2)];
    var best=0; for (var i=1;i<p.length;i++) if(p[i]>p[best]) best=i;
    var sym = (p[best]-med>=14 && p[best]>-95) ? best : -1;
    this.lastHit=sym;
    if (sym===this.cand) this.run++; else { this.cand=sym; this.run=1; }
    if (sym===-1){ if(this.run>=12){ this.seq=[]; this.last=-1; } return null; }
    if (this.run===2 && sym!==this.last){
      this.last=sym; this.seq.push(sym); if(this.onSym) this.onSym(sym); if(this.seq.length>8) this.seq.shift();
      return this._try();
    }
    return null;
  };
  Decoder.prototype._try=function(){
    var s=this.seq, n=s.length;
    if (n>=3){
      var d=s[n-2], c=s[n-1], pre=s[n-3];
      if (pre===M2 && d<16 && c<16 && check(d)===c){
        this.seq=[]; if(this.onMsg) this.onMsg(d); return d;
      }
    }
    return null;
  };
  return {FREQS:FREQS,NAMES:NAMES,M1:M1,M2:M2,SYM:SYM,GAP:GAP,schedule:schedule,check:check,powers:powers,Decoder:Decoder};
})();
if (typeof module!=='undefined') module.exports=Modem;

  var W=cv.clientWidth,H=cv.clientHeight;cg.clearRect(0,0,W,H);
  for(var i=0;i<18;i++){var y=strY(i),bx=bridgeX(i,W),a=amp[i];phase[i]+=0.9;
    cg.strokeStyle=i>=16?'rgba(183,49,42,.9)':'rgba(42,36,32,'+(0.55+0.4*a)+')';cg.lineWidth=i>=16?1.4:2.2-i*0.07;

// ---------- 声音 ----------
function ac(){if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)()}if(ctx.state!=='running')ctx.resume();return ctx}
function sing(i,cb){
  var a=ac(), sc=Modem.schedule(i), t0=a.currentTime+0.12, out=a.createGain(); out.gain.value=0.5; out.connect(a.destination);
  sc.notes.forEach(function(n){var o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=Modem.FREQS[n.idx];
    var s=t0+n.t,e=s+n.dur;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(1,s+.008);g.gain.setTargetAtTime(.7,s+.01,.05);g.gain.setValueAtTime(.7,e-.03);g.gain.linearRampToValueAtTime(0,e);

async function startListen(){
  var a=ac();

    if(dec.lastHit>=0&&Math.random()<.25)pluck(dec.lastHit,.8);},25);
